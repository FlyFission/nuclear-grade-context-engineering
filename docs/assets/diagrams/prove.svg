<path class="ln" stroke-width="1.2" d="M1234.8000000000002,506.0 L1250.8000000000002,506.0 Q1258.8000000000002,506.0 1258.8000000000002,514.0 L1258.8000000000002,588 Q1258.8000000000002,596 1250.8000000000002,596 L156,596 Q148,596 148,588 L148,114.0 Q148,106.0 156,106.0 L176.0,106.0" stroke-dasharray="5 4" marker-end="url(#m-muted)"/>
<rect class="n-step" stroke-width="1" x="176.0" y="86.0" width="104" height="40" rx="20.0"/>
<text x="228.0" y="110.0" class="name ink" text-anchor="middle">Question</text>
<rect class="n-step" stroke-width="1" x="300.0" y="86.0" width="104" height="40" rx="20.0"/>
<text x="352.0" y="110.0" class="name ink" text-anchor="middle">Discover</text>
<rect class="n-step" stroke-width="1" x="424.0" y="86.0" width="104" height="40" rx="20.0"/>
<text x="476.0" y="110.0" class="name ink" text-anchor="middle">Specify</text>
<rect class="n-step" stroke-width="1" x="548.0" y="86.0" width="104" height="40" rx="20.0"/>
<text x="600.0" y="110.0" class="name ink" text-anchor="middle">Plan</text>
<rect class="n-step" stroke-width="1" x="548.0" y="186.0" width="104" height="40" rx="20.0"/>
<text x="600.0" y="210.0" class="name ink" text-anchor="middle">Execute</text>
<rect class="n-step" stroke-width="1" x="548.0" y="286.0" width="104" height="40" rx="20.0"/>
<text x="600.0" y="310.0" class="name ink" text-anchor="middle">Verify</text>
<rect class="n-step" stroke-width="1" x="672.0" y="286.0" width="104" height="40" rx="20.0"/>
