name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale PR runs; never cancel a main-branch run mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # pyyaml is test-only (the shipped nuclear_grade package keeps zero runtime
        # deps); it lets the scaffold-ci test parse the generated workflow as real YAML.
        run: python -m pip install --upgrade pip pytest ruff pyyaml

      - name: Run tests
        run: python -m pytest -q

      - name: Run ruff lint
        run: python -m ruff check .

      - name: Compile Python files
        run: python -m py_compile tools/ng.py tools/ng_validate.py docs/03-worked-examples/ai-agent-tool-permissions/reference/workspace_guard.py

      - name: Run repo doctor
        run: python tools/ng.py doctor .

      - name: Check release identity (versions, citation, changelog agree)
        run: python -m nuclear_grade.release

      - name: Evidence badge must match the records
        run: |
          python tools/ng.py badge . --out .nuclear/badge.json
          git diff --exit-code -- .nuclear/badge.json || { echo "Run: python tools/ng.py badge . --out .nuclear/badge.json"; exit 1; }

      - name: Enforce token budget
        run: python tools/ng.py tokens .

      - name: Validate change packets
        shell: bash
        run: |
          set -euo pipefail
          # Skip packets deliberately closed via the documented closure path
          # (a `NUCLEAR-GRADE-CLOSED: <rationale>` line): kept for audit history,
          # the validator still rejects their unfilled fields.
          is_closed() { grep -rqE '^[[:space:]]*NUCLEAR-GRADE-CLOSED:[[:space:]]*[^[:space:]]' "$1"; }
          for packet in .nuclear/changes/*; do
            [ -d "$packet" ] || continue
            if is_closed "$packet"; then echo "Skipping closed record: $packet"; continue; fi
            python tools/ng.py validate "$packet"
          done
          while IFS= read -r packet; do
            if is_closed "$packet"; then echo "Skipping closed record: $packet"; continue; fi
            python tools/ng.py validate "$packet"
          done < <(find docs/03-worked-examples -path '*/.nuclear/changes/*' -type d -prune -print)

      - name: Write validation receipts
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          for packet in .nuclear/changes/* docs/03-worked-examples/*/.nuclear/changes/* challenge/.nuclear/changes/*; do
            [ -d "$packet" ] || continue
            # Receipts record failures too; the gate above is what fails the build.
            python tools/ng.py validate "$packet" --json > "receipts/$(basename "$packet").json" || true
          done

      - name: Keep receipts with the run
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-receipts
          path: receipts/
          retention-days: 90

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Install wheel into clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install --upgrade pip
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl

      - name: Smoke-test installed CLI outside source tree
        shell: bash
        run: |
          set -euo pipefail
          NG=/tmp/wheel-smoke-venv/bin/nuclear-grade
          WORK=$(mktemp -d)
          cd "$WORK"
          "$NG" init .
          "$NG" new my-quick --mode quick
          "$NG" new my-std --mode standard
          "$NG" new my-cm --mode cm
          "$NG" new my-gp --mode golden-path
          LIST_OUTPUT=$("$NG" list)
          echo "$LIST_OUTPUT"
          echo "$LIST_OUTPUT" | grep -q "Skills:"
          echo "$LIST_OUTPUT" | grep -q "questioning-attitude"
          echo "$LIST_OUTPUT" | grep -q "ng-question.md"
          set +e
          "$NG" validate .nuclear/changes/my-quick
          rc=$?
          set -e
          [ "$rc" -eq 1 ]
          echo "wheel-smoke OK"

  mcp-smoke:
    # The MCP server ships behind the optional `mcp` extra, so the main `validate`
    # job stays zero-dependency and its test is importorskip-skipped there. This
    # job installs the extra so build_server() and list_tools() actually run --
    # otherwise the server could break and CI would stay green. Both supported SDK
    # majors run, because the extra's range (`mcp>=1.0,<3`) admits both.
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mcp-spec: ["mcp>=1.0,<2", "mcp>=2,<3"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install with the optional MCP extra
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e ".[mcp]" "${{ matrix.mcp-spec }}"

      - name: Run MCP server tests with the extra present
        run: python -m pytest tests/test_mcp_server.py -q

  ci-gate:
    # One stable required check for branch protection. `if: always()` matters: without
    # it a failed upstream job leaves this job skipped, and a skipped job satisfies a
    # required check -- a red build would read as green. (Pattern from uber/ADR's CI.)
    name: CI gate
    runs-on: ubuntu-latest
    needs: [validate, wheel-smoke, mcp-smoke]
    if: always()
    steps:
      - name: Every upstream job must succeed
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.wheel-smoke.result }}" = "success"
          test "${{ needs.mcp-smoke.result }}" = "success"
