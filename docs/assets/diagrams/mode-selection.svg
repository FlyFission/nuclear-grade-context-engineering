<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">Choosing a rigor mode</title>
<desc id="d">Start from a change request. Purely administrative and instantly reversible: administrative floor. Local, reversible, obvious proof: Quick packet. User, data, dependency, permission, AI authority or release consequence: Standard packet. Severe, silent, irreversible or external trust: human-reviewed stronger mode. Already went wrong: incident pattern.</desc>
<style>
.bg{fill:#F7F6F2} .ink{fill:#0E1A30} .muted{fill:#46536B} .soft{fill:#5A6680}
.acc{fill:#8A5A00} .lnk{fill:#2F4F94}
.n-step{fill:#FFFFFF;stroke:#0E1A30} .n-store{fill:rgba(14,26,48,0.05);stroke:#46536B}
.n-focal{fill:rgba(255,210,77,0.22);stroke:#8A5A00} .n-ext{fill:rgba(14,26,48,0.03);stroke:rgba(14,26,48,0.32)}
.n-opt{fill:rgba(14,26,48,0.02);stroke:rgba(14,26,48,0.36);stroke-dasharray:4 3}
.n-indep{fill:rgba(47,79,148,0.07);stroke:#2F4F94}
.grp{fill:none;stroke:rgba(14,26,48,0.22);stroke-dasharray:4 4}
.band{fill:rgba(14,26,48,0.035);stroke:rgba(14,26,48,0.10)}
.ln{fill:none;stroke:#46536B} .ln-acc{fill:none;stroke:#8A5A00} .ln-lnk{fill:none;stroke:#2F4F94}
.life{stroke:rgba(14,26,48,0.25);stroke-dasharray:3 4}
.mask{fill:#F7F6F2} .rule{stroke:rgba(14,26,48,0.14)}
.name{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}
.sub{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px}
.eye{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;font-weight:600;letter-spacing:0.16em}
.lbl{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;letter-spacing:0.04em}
.ttl{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-size:22px}
.call{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px}
@media (prefers-color-scheme: dark){
.bg{fill:#0E1A30} .ink{fill:#F4F7FC} .muted{fill:#B3C2DA} .soft{fill:#9DB0CE}
.acc{fill:#FFD24D} .lnk{fill:#8FB0E6}
.n-step{fill:#16263F;stroke:#D7E0EE} .n-store{fill:rgba(244,247,252,0.05);stroke:#9DB0CE}
.n-focal{fill:rgba(255,210,77,0.14);stroke:#FFD24D} .n-ext{fill:rgba(244,247,252,0.03);stroke:rgba(244,247,252,0.34)}
.n-opt{fill:rgba(244,247,252,0.02);stroke:rgba(244,247,252,0.40)}
.n-indep{fill:rgba(143,176,230,0.10);stroke:#8FB0E6}
.grp{stroke:rgba(244,247,252,0.26)} .band{fill:rgba(244,247,252,0.035);stroke:rgba(244,247,252,0.10)}
.ln{stroke:#9DB0CE} .ln-acc{stroke:#FFD24D} .ln-lnk{stroke:#8FB0E6}
.life{stroke:rgba(244,247,252,0.28)} .mask{fill:#0E1A30} .rule{stroke:rgba(244,247,252,0.16)}
}
</style>
<defs>
<marker id="m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="muted" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="acc" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-lnk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="lnk" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="960" height="560" rx="10"/>
<text x="28" y="34" class="eye soft">MODE SELECTION · LIGHTEST HONEST MODE</text>
<line class="rule" x1="28" y1="44" x2="932" y2="44"/>
<path class="ln" stroke-width="1.2" d="M360.0,104 L360.0,128" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M480,174.0 L600,174.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M360.0,220 L360.0,248" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M480,294.0 L600,294.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M360.0,340 L360.0,368" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M480,414.0 L600,414.0" marker-end="url(#m-muted)"/>
<path class="ln-acc" stroke-width="1.2" d="M360.0,460 L360.0,496" marker-end="url(#m-acc)"/>
<path class="ln" stroke-width="1.2" d="M240,414.0 L120.0,414.0 Q112.0,414.0 112.0,422.0 L112.0,496" marker-end="url(#m-muted)"/>
<rect class="n-ext" stroke-width="1" x="280" y="64" width="160" height="40" rx="20"/>
<text x="360.0" y="88.0" class="name ink" text-anchor="middle">Change request</text>
<polygon class="n-step" stroke-width="1" points="360.0,128 480,174.0 360.0,220 240,174.0"/>
<text x="360.0" y="165.0" class="name ink" text-anchor="middle">Purely administrative?</text>
<text x="360.0" y="180.0" class="sub soft" text-anchor="middle">instantly reversible ·</text>
<text x="360.0" y="193.0" class="sub soft" text-anchor="middle">no new trust boundary</text>
<polygon class="n-step" stroke-width="1" points="360.0,248 480,294.0 360.0,340 240,294.0"/>
<text x="360.0" y="285.0" class="name ink" text-anchor="middle">Local &amp; reversible?</text>
<text x="360.0" y="300.0" class="sub soft" text-anchor="middle">obvious proof ·</text>
<text x="360.0" y="313.0" class="sub soft" text-anchor="middle">no new trust boundary</text>
<polygon class="n-step" stroke-width="1" points="360.0,368 480,414.0 360.0,460 240,414.0"/>
<text x="360.0" y="405.0" class="name ink" text-anchor="middle">Real consequence?</text>
<text x="360.0" y="420.0" class="sub soft" text-anchor="middle">user · data · dep · permission</text>
<text x="360.0" y="433.0" class="sub soft" text-anchor="middle">AI authority · release</text>
<rect class="n-ext" stroke-width="1" x="600" y="150" width="320" height="48" rx="6"/>
<text x="760.0" y="171.5" class="name ink" text-anchor="middle">Administrative floor</text>
<text x="760.0" y="186.5" class="sub soft" text-anchor="middle">no packet — the commit message is the record</text>
<rect class="n-step" stroke-width="1" x="600" y="270" width="320" height="48" rx="6"/>
<text x="760.0" y="291.5" class="name ink" text-anchor="middle">Quick packet</text>
<text x="760.0" y="306.5" class="sub soft" text-anchor="middle">risk.md + proof.md</text>
<rect class="n-step" stroke-width="1" x="600" y="390" width="320" height="48" rx="6"/>
<text x="760.0" y="411.5" class="name ink" text-anchor="middle">Standard packet</text>
<text x="760.0" y="426.5" class="sub soft" text-anchor="middle">6 files</text>
<rect class="n-focal" stroke-width="1.4" x="240" y="496" width="240" height="48" rx="6"/>
<text x="360.0" y="524.0" class="name ink" text-anchor="middle">Human-reviewed stronger mode</text>
<rect class="n-store" stroke-width="1" x="28" y="496" width="168" height="48" rx="6"/>
<text x="112.0" y="524.0" class="name ink" text-anchor="middle">Incident pattern</text>
<rect class="mask" x="526.0" y="166.0" width="28.0" height="15" rx="2"/>
<text x="540.0" y="177.5" class="lbl muted" text-anchor="middle">yes</text>
<rect class="mask" x="349.0" y="226.0" width="22.0" height="15" rx="2"/>
<text x="360.0" y="237.5" class="lbl muted" text-anchor="middle">no</text>
<rect class="mask" x="526.0" y="286.0" width="28.0" height="15" rx="2"/>
<text x="540.0" y="297.5" class="lbl muted" text-anchor="middle">yes</text>
<rect class="mask" x="349.0" y="346.0" width="22.0" height="15" rx="2"/>
<text x="360.0" y="357.5" class="lbl muted" text-anchor="middle">no</text>
<rect class="mask" x="526.0" y="406.0" width="28.0" height="15" rx="2"/>
<text x="540.0" y="417.5" class="lbl muted" text-anchor="middle">yes</text>
<rect class="mask" x="214.0" y="470.0" width="292.0" height="15" rx="2"/>
<text x="360.0" y="481.5" class="lbl acc" text-anchor="middle">severe · silent · irreversible · external trust</text>
<rect class="mask" x="53.0" y="446.0" width="118.0" height="15" rx="2"/>
<text x="112.0" y="457.5" class="lbl muted" text-anchor="middle">already went wrong</text>
</svg>
