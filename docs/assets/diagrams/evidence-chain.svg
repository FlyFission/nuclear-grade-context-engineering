<path class="ln" stroke-width="1.2" d="M238,230.0 L208,230.0" marker-end="url(#m-muted)"/>
<path class="ln-acc" stroke-width="1.2" d="M124.0,204 L124.0,176 Q124.0,168 132.0,168 L512.0,168 Q520.0,168 520.0,160 L520.0,128" stroke-dasharray="5 4" marker-end="url(#m-acc)"/>
<rect class="n-ext" stroke-width="1" x="40" y="76" width="168" height="52" rx="6"/>
<text x="124.0" y="106.0" class="name ink" text-anchor="middle">Change intent</text>
