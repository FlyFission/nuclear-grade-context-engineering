[project]
name = "nuclear-grade"
version = "0.6.0"
description = "Configuration management for AI-assisted software work."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ben Huffer" }]
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "context-engineering",
  "configuration-management",
  "change-control",
  "code-review",
  "software-assurance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/FlyFission/nuclear-grade-context-engineering"
Documentation = "https://github.com/FlyFission/nuclear-grade-context-engineering/blob/main/QUICKSTART.md"
Source = "https://github.com/FlyFission/nuclear-grade-context-engineering"
Issues = "https://github.com/FlyFission/nuclear-grade-context-engineering/issues"
Changelog = "https://github.com/FlyFission/nuclear-grade-context-engineering/blob/main/CHANGELOG.md"

[project.scripts]
nuclear-grade = "nuclear_grade.cli:main"
nuclear-grade-mcp = "nuclear_grade.mcp_server:main"

[project.optional-dependencies]
mcp = [
  # Upper-bounded deliberately at the next untested major. mcp 2.0.0 renamed
  # `mcp.server.fastmcp.FastMCP` to `mcp.server.mcpserver.MCPServer`;
  # `nuclear_grade/mcp_server.py` imports either, and CI's mcp-smoke job runs the
  # server tests against both majors. Lift the bound only with a tested 3.x port.
  "mcp>=1.0,<3",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.2",
]

[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# PyPI shows README.md without the repo around it, so relative links and images would
# break there. Point them at GitHub for the package page only; the file is unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/FlyFission/nuclear-grade-context-engineering/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/FlyFission/nuclear-grade-context-engineering/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["nuclear_grade"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "nuclear_grade/_bundled/templates"
"skills" = "nuclear_grade/_bundled/skills"
"skills-beta" = "nuclear_grade/_bundled/skills-beta"
"skills-deprecated" = "nuclear_grade/_bundled/skills-deprecated"
"commands" = "nuclear_grade/_bundled/commands"
"skill-catalog.json" = "nuclear_grade/_bundled/skill-catalog.json"
# Sources for `init --hook` and `init --agents` when run from an installed wheel.
"hooks/pre_tool_use.py" = "nuclear_grade/_bundled/hooks/pre_tool_use.py"
"starter-kit/core/AGENTS.md" = "nuclear_grade/_bundled/starter-kit/core/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = [
  "/nuclear_grade",
  "/templates",
  "/skills",
  "/skills-beta",
  "/skills-deprecated",
  "/commands",
  "/skill-catalog.json",
  "/hooks",
  "/starter-kit",
  "/tests",
  "/tools",
  "/docs",
  "/challenge",
  "/README.md",
  "/INTEGRATIONS.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/install.sh",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "docs/03-worked-examples/ai-agent-tool-permissions/tests",
]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/ng.py" = ["E402", "F403", "F405"]
"tools/ng_validate.py" = ["E402"]
"nuclear_grade/cli.py" = ["E402", "UP036"]
"nuclear_grade/__init__.py" = ["F401"]
