<text x="718.0" y="242.5" class="sub soft" text-anchor="middle">verification.md</text>
<rect class="n-store" stroke-width="1" x="436" y="204" width="168" height="52" rx="6"/>
<text x="520.0" y="234.0" class="name ink" text-anchor="middle">Baseline record</text>
<rect class="n-step" stroke-width="1" x="238" y="204" width="168" height="52" rx="6"/>
<text x="322.0" y="227.5" class="name ink" text-anchor="middle">Release readiness</text>
<text x="322.0" y="242.5" class="sub soft" text-anchor="middle">ship.md</text>
<rect class="n-step" stroke-width="1" x="40" y="204" width="168" height="52" rx="6"/>
<text x="124.0" y="227.5" class="name ink" text-anchor="middle">Operating signals</text>
<text x="124.0" y="242.5" class="sub soft" text-anchor="middle">opex.md</text>
<rect class="mask" x="278.0" y="160" width="88.0" height="15" rx="2"/>
