<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
<title id="t">Skill map</title>
<desc id="d">The core path runs from using-nuclear-grade through questioning-attitude, rating-change-risk, creating-change-records, proving-claims, checking-release-readiness, recording-a-known-good-version and learning-from-experience, which feeds back to questioning-attitude. Rating-change-risk branches to choosing-what-to-control and checking-what-a-change-affects. Heavier overlays switch on by consequence.</desc>
