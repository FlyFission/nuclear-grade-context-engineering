<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Nuclear-grade Context Engineering</title>
  <desc id="d">Control rods settle into a glowing reactor core. Let AI do serious software work and stay in control of what ships. Install with pipx install nuclear-grade.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .rod { animation: insert 9s cubic-bezier(.3,.7,.2,1) infinite; }
    .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .75s; } .r5 { animation-delay: 1s; }
    @keyframes insert { 0% { transform: translateY(-150px); } 30% { transform: translateY(0); } 88% { transform: translateY(0); } 100% { transform: translateY(-150px); } }
    .cell { animation: glow 9s ease-in-out infinite; }
    @keyframes glow { 0% { opacity: 1; } 35% { opacity: .45; } 85% { opacity: .45; } 100% { opacity: 1; } }
    .halo { animation: halo 9s ease-in-out infinite; transform-origin: 236px 236px; }
    @keyframes halo { 0% { opacity: .9; transform: scale(1.08); } 35% { opacity: .45; transform: scale(1); } 85% { opacity: .45; transform: scale(1); } 100% { opacity: .9; transform: scale(1.08); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rod, .cell, .halo, .cursor { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1528"/><stop offset="1" stop-color="#15243D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A5BA8"/><stop offset=".5" stop-color="#5BC8B3"/><stop offset="1" stop-color="#FFD24D"/>
    </linearGradient>
    <radialGradient id="cherenkov" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4FB3FF" stop-opacity=".55"/><stop offset=".6" stop-color="#2A6FD6" stop-opacity=".18"/><stop offset="1" stop-color="#2A6FD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FE4FF"/><stop offset="1" stop-color="#3C8FE0"/>
    </linearGradient>
    <linearGradient id="rodfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A6B85"/><stop offset=".5" stop-color="#C9D3E2"/><stop offset="1" stop-color="#5A6B85"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle class="halo" cx="236" cy="236" r="190" fill="url(#cherenkov)"/>

    <!-- core: 5 x 3 fuel cells -->
    <g transform="translate(120 172)">
      <rect x="-14" y="-14" width="260" height="164" rx="14" fill="#0A1222" stroke="#2C4468" stroke-width="2"/>
      <g fill="url(#fuel)">
        <rect class="cell" x="0" y="0" width="40" height="40" rx="6"/><rect class="cell" x="48" y="0" width="40" height="40" rx="6"/><rect class="cell" x="96" y="0" width="40" height="40" rx="6"/><rect class="cell" x="144" y="0" width="40" height="40" rx="6"/><rect class="cell" x="192" y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="0" y="48" width="40" height="40" rx="6"/><rect class="cell" x="48" y="48" width="40" height="40" rx="6"/><rect class="cell" x="96" y="48" width="40" height="40" rx="6"/><rect class="cell" x="144" y="48" width="40" height="40" rx="6"/><rect class="cell" x="192" y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="0" y="96" width="40" height="40" rx="6"/><rect class="cell" x="48" y="96" width="40" height="40" rx="6"/><rect class="cell" x="96" y="96" width="40" height="40" rx="6"/><rect class="cell" x="144" y="96" width="40" height="40" rx="6"/><rect class="cell" x="192" y="96" width="40" height="40" rx="6"/>
      </g>
    </g>

    <!-- control rods: final position is inserted into the core -->
    <g fill="url(#rodfill)" stroke="#2A3850" stroke-width="1.5">
      <g class="rod"><rect x="160" y="34" width="12" height="236" rx="5"/></g>
      <g class="rod r2"><rect x="208" y="34" width="12" height="236" rx="5"/></g>
      <g class="rod r3"><rect x="256" y="34" width="12" height="236" rx="5"/></g>
      <g class="rod r4"><rect x="304" y="34" width="12" height="236" rx="5"/></g>
    </g>
    <rect x="120" y="26" width="232" height="10" rx="5" fill="#2C4468"/>

    <!-- words -->
    <g class="sans">
      <text x="444" y="112" fill="#F4F7FC" font-size="66" font-weight="800" letter-spacing="1.5">NUCLEAR-GRADE</text>
      <text x="447" y="156" fill="#9DB6E0" font-size="25" font-weight="600" letter-spacing="10">CONTEXT ENGINEERING</text>
      <rect x="447" y="178" width="500" height="3" rx="1.5" fill="url(#rule)"/>
      <text x="446" y="220" fill="#D7E0EE" font-size="24" font-weight="500">Let AI do serious software work</text>
      <text x="446" y="252" fill="#D7E0EE" font-size="24" font-weight="500">and stay in control of what ships.</text>
    </g>
    <rect x="444" y="278" width="380" height="46" rx="10" fill="#0A1222" stroke="#35507A" stroke-width="1.5"/>
    <text class="mono" x="464" y="308" font-size="20" fill="#5BC8B3">$</text>
    <text class="mono" x="486" y="308" font-size="20" fill="#E8EEF7">pipx install nuclear-grade</text>
    <rect class="cursor" x="802" y="291" width="3" height="22" fill="#FFD24D"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#283C5C" stroke-width="2"/>
</svg>
