<text x="934.8000000000001" y="402.0" class="name ink" text-anchor="middle">Cleared to</text>
<text x="934.8000000000001" y="418.0" class="name ink" text-anchor="middle">apply now?</text>
<rect class="n-store" stroke-width="1" x="882.8000000000001" y="486.0" width="104" height="40" rx="20.0"/>
