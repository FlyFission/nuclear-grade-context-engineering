name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m py_compile tools/ng.py tools/ng_validate.py docs/03-worked-examples/ai-agent-tool-permissions/reference/workspace_guard.py

      - name: Run repo doctor
        run: python tools/ng.py doctor .

      - name: Validate change packets
        shell: bash
        run: |
          set -euo pipefail
          for packet in .nuclear/changes/*; do
            [ -d "$packet" ] || continue
            python tools/ng.py validate "$packet"
          done
          while IFS= read -r packet; do
            python tools/ng.py validate "$packet"
          done < <(find docs/03-worked-examples -path '*/.nuclear/changes/*' -type d -prune -print)
