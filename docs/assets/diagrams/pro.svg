<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 416" width="1040" height="416" role="img" aria-labelledby="t d">
<title id="t">PRO: Plan · Run · Operate</title>
<desc id="d">Three bands. Plan: Question, Discover, Specify, Plan. Run: Execute, Verify, Review, Decide. Operate: Baseline, Operate, Learn. Decide ships to Baseline, or blocks or defers back to Plan; lessons feed the next Question.</desc>
<style>
.bg{fill:#F7F6F2} .ink{fill:#0E1A30} .muted{fill:#46536B} .soft{fill:#5A6680}
.acc{fill:#8A5A00} .lnk{fill:#2F4F94}
.n-step{fill:#FFFFFF;stroke:#0E1A30} .n-store{fill:rgba(14,26,48,0.05);stroke:#46536B}
.n-focal{fill:rgba(255,210,77,0.22);stroke:#8A5A00} .n-ext{fill:rgba(14,26,48,0.03);stroke:rgba(14,26,48,0.32)}
.n-opt{fill:rgba(14,26,48,0.02);stroke:rgba(14,26,48,0.36);stroke-dasharray:4 3}
.n-indep{fill:rgba(47,79,148,0.07);stroke:#2F4F94}
.grp{fill:none;stroke:rgba(14,26,48,0.22);stroke-dasharray:4 4}
.band{fill:rgba(14,26,48,0.035);stroke:rgba(14,26,48,0.10)}
.ln{fill:none;stroke:#46536B} .ln-acc{fill:none;stroke:#8A5A00} .ln-lnk{fill:none;stroke:#2F4F94}
.life{stroke:rgba(14,26,48,0.25);stroke-dasharray:3 4}
.mask{fill:#F7F6F2} .rule{stroke:rgba(14,26,48,0.14)}
.name{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}
.sub{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px}
.eye{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;font-weight:600;letter-spacing:0.16em}
.lbl{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;letter-spacing:0.04em}
.ttl{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-size:22px}
.call{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px}
@media (prefers-color-scheme: dark){
.bg{fill:#0E1A30} .ink{fill:#F4F7FC} .muted{fill:#B3C2DA} .soft{fill:#9DB0CE}
.acc{fill:#FFD24D} .lnk{fill:#8FB0E6}
.n-step{fill:#16263F;stroke:#D7E0EE} .n-store{fill:rgba(244,247,252,0.05);stroke:#9DB0CE}
.n-focal{fill:rgba(255,210,77,0.14);stroke:#FFD24D} .n-ext{fill:rgba(244,247,252,0.03);stroke:rgba(244,247,252,0.34)}
.n-opt{fill:rgba(244,247,252,0.02);stroke:rgba(244,247,252,0.40)}
.n-indep{fill:rgba(143,176,230,0.10);stroke:#8FB0E6}
.grp{stroke:rgba(244,247,252,0.26)} .band{fill:rgba(244,247,252,0.035);stroke:rgba(244,247,252,0.10)}
.ln{stroke:#9DB0CE} .ln-acc{stroke:#FFD24D} .ln-lnk{stroke:#8FB0E6}
.life{stroke:rgba(244,247,252,0.28)} .mask{fill:#0E1A30} .rule{stroke:rgba(244,247,252,0.16)}
}
</style>
<defs>
<marker id="m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="muted" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="acc" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-lnk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="lnk" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="1040" height="416" rx="10"/>
<text x="28" y="34" class="eye soft">PRO · THE PATH IN THREE MOVES</text>
<line class="rule" x1="28" y1="44" x2="1012" y2="44"/>
<rect class="band" x="40" y="64" width="960" height="92" rx="8"/>
<text x="54" y="82" class="eye soft" text-anchor="start">P — PLAN</text>
<rect class="band" x="40" y="176" width="960" height="92" rx="8"/>
<text x="54" y="194" class="eye soft" text-anchor="start">R — RUN</text>
<rect class="band" x="40" y="288" width="960" height="92" rx="8"/>
<text x="54" y="306" class="eye soft" text-anchor="start">O — OPERATE</text>
<path class="ln" stroke-width="1.2" d="M332,110.0 L360,110.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M472,110.0 L500,110.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M612,110.0 L640,110.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M452,222.0 L480,222.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M592,222.0 L620,222.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M732,222.0 L760,222.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M572,334.0 L600,334.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M712,334.0 L740,334.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M696.0,130.0 L696.0,168.0 Q696.0,176.0 688.0,176.0 L404.0,176.0 Q396.0,176.0 396.0,184.0 L396.0,202.0" marker-end="url(#m-muted)"/>
<path class="ln-acc" stroke-width="1.2" d="M824.0,252.0 L824.0,276.0 Q824.0,284.0 816.0,284.0 L524.0,284.0 Q516.0,284.0 516.0,292.0 L516.0,314.0" marker-end="url(#m-acc)"/>
<path class="ln-acc" stroke-width="1.2" d="M888,222.0 L912,222.0 Q920,222.0 920,214.0 L920,118.0 Q920,110.0 912,110.0 L752,110.0" stroke-dasharray="5 4" marker-end="url(#m-acc)"/>
<path class="ln" stroke-width="1.2" d="M852,334.0 L884,334.0 Q892,334.0 892,342.0 L892,358.0 Q892,366.0 884,366.0 L188,366.0 Q180,366.0 180,358.0 L180,118.0 Q180,110.0 188,110.0 L220,110.0" stroke-dasharray="5 4" marker-end="url(#m-muted)"/>
<rect class="n-step" stroke-width="1" x="220" y="90.0" width="112" height="40" rx="20.0"/>
<text x="276.0" y="114.0" class="name ink" text-anchor="middle">Question</text>
<rect class="n-step" stroke-width="1" x="360" y="90.0" width="112" height="40" rx="20.0"/>
<text x="416.0" y="114.0" class="name ink" text-anchor="middle">Discover</text>
<rect class="n-step" stroke-width="1" x="500" y="90.0" width="112" height="40" rx="20.0"/>
<text x="556.0" y="114.0" class="name ink" text-anchor="middle">Specify</text>
<rect class="n-step" stroke-width="1" x="640" y="90.0" width="112" height="40" rx="20.0"/>
<text x="696.0" y="114.0" class="name ink" text-anchor="middle">Plan</text>
<rect class="n-step" stroke-width="1" x="340" y="202.0" width="112" height="40" rx="20.0"/>
<text x="396.0" y="226.0" class="name ink" text-anchor="middle">Execute</text>
<rect class="n-step" stroke-width="1" x="480" y="202.0" width="112" height="40" rx="20.0"/>
<text x="536.0" y="226.0" class="name ink" text-anchor="middle">Verify</text>
<rect class="n-step" stroke-width="1" x="620" y="202.0" width="112" height="40" rx="20.0"/>
<text x="676.0" y="226.0" class="name ink" text-anchor="middle">Review</text>
<polygon class="n-focal" stroke-width="1.4" points="824.0,192.0 888,222.0 824.0,252.0 760,222.0"/>
<text x="824.0" y="226.0" class="name ink" text-anchor="middle">Decide</text>
<rect class="n-store" stroke-width="1" x="460" y="314.0" width="112" height="40" rx="20.0"/>
<text x="516.0" y="338.0" class="name ink" text-anchor="middle">Baseline</text>
<rect class="n-store" stroke-width="1" x="600" y="314.0" width="112" height="40" rx="20.0"/>
<text x="656.0" y="338.0" class="name ink" text-anchor="middle">Operate</text>
<rect class="n-store" stroke-width="1" x="740" y="314.0" width="112" height="40" rx="20.0"/>
<text x="796.0" y="338.0" class="name ink" text-anchor="middle">Learn</text>
<rect class="mask" x="773.0" y="276.0" width="34.0" height="15" rx="2"/>
<text x="790.0" y="287.5" class="lbl acc" text-anchor="middle">ship</text>
<rect class="mask" x="876.0" y="158.0" width="88.0" height="15" rx="2"/>
<text x="920" y="169.5" class="lbl acc" text-anchor="middle">block / defer</text>
<rect class="mask" x="314.0" y="358.0" width="172.0" height="15" rx="2"/>
<text x="400" y="369.5" class="lbl muted" text-anchor="middle">lessons feed the next basis</text>
</svg>
