name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m py_compile tools/ng.py tools/ng_validate.py docs/03-worked-examples/ai-agent-tool-permissions/reference/workspace_guard.py

      - name: Run repo doctor
        run: python tools/ng.py doctor .

      - name: Validate flagship packet
        run: python tools/ng.py validate docs/03-worked-examples/ai-agent-tool-permissions/.nuclear/changes/add-agent-tool-permissions

      - name: Validate launch packet
        run: python tools/ng.py validate .nuclear/changes/public-v0-launch

      - name: Validate productization packet
        run: python tools/ng.py validate .nuclear/changes/peer-ready-release
