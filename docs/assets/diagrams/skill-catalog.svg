<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 582" width="1180" height="582" role="img" aria-labelledby="t d">
<title id="t">The skill catalog</title>
<desc id="d">31 skills in seven families, each with the situation that calls for it. Start here: the using-nuclear-grade router, questioning-attitude, rating-change-risk. Before you act: double-checking, declaring intent, deciding who decides, staying on mission. Records and versions: change records, stale records, approved versions, change impact, agent run records. Evidence and verdicts: proving claims, checking facts, code review, final artifacts, stress tests, review panels, release readiness. Trust and public claims: outside code and models, legal and safety wording, source claims. Delegation and structure: briefing, handoffs, work breakdown, folders. When it goes wrong: incidents, lessons, deficiencies, shared defects. A gold dot marks the Core 7, which apply to every change.</desc>
