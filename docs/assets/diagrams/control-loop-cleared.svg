<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="t d">
<title id="t">Configuration control loop</title>
<desc id="d">Controlled items (code, prompts, models, dependencies, docs, releases) receive a change; evidence names pass or gap; Decide on purpose. Only a ship decision saves the baseline, which is operated and yields lessons that feed the next change. Block or defer returns to the change. A Cleared-to-apply-now gate holds while clearance is lapsed.</desc>
<style>
.bg{fill:#F7F6F2} .ink{fill:#0E1A30} .muted{fill:#46536B} .soft{fill:#5A6680}
.acc{fill:#8A5A00} .lnk{fill:#2F4F94}
.n-step{fill:#FFFFFF;stroke:#0E1A30} .n-store{fill:rgba(14,26,48,0.05);stroke:#46536B}
.n-focal{fill:rgba(255,210,77,0.22);stroke:#8A5A00} .n-ext{fill:rgba(14,26,48,0.03);stroke:rgba(14,26,48,0.32)}
.n-opt{fill:rgba(14,26,48,0.02);stroke:rgba(14,26,48,0.36);stroke-dasharray:4 3}
.n-indep{fill:rgba(47,79,148,0.07);stroke:#2F4F94}
.grp{fill:none;stroke:rgba(14,26,48,0.22);stroke-dasharray:4 4}
.band{fill:rgba(14,26,48,0.035);stroke:rgba(14,26,48,0.10)}
.ln{fill:none;stroke:#46536B} .ln-acc{fill:none;stroke:#8A5A00} .ln-lnk{fill:none;stroke:#2F4F94}
.life{stroke:rgba(14,26,48,0.25);stroke-dasharray:3 4}
.mask{fill:#F7F6F2} .rule{stroke:rgba(14,26,48,0.14)}
.name{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}
.sub{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px}
.eye{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;font-weight:600;letter-spacing:0.16em}
.lbl{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;letter-spacing:0.04em}
.ttl{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-size:22px}
.call{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px}
@media (prefers-color-scheme: dark){
.bg{fill:#0E1A30} .ink{fill:#F4F7FC} .muted{fill:#B3C2DA} .soft{fill:#9DB0CE}
.acc{fill:#FFD24D} .lnk{fill:#8FB0E6}
.n-step{fill:#16263F;stroke:#D7E0EE} .n-store{fill:rgba(244,247,252,0.05);stroke:#9DB0CE}
.n-focal{fill:rgba(255,210,77,0.14);stroke:#FFD24D} .n-ext{fill:rgba(244,247,252,0.03);stroke:rgba(244,247,252,0.34)}
.n-opt{fill:rgba(244,247,252,0.02);stroke:rgba(244,247,252,0.40)}
.n-indep{fill:rgba(143,176,230,0.10);stroke:#8FB0E6}
.grp{stroke:rgba(244,247,252,0.26)} .band{fill:rgba(244,247,252,0.035);stroke:rgba(244,247,252,0.10)}
.ln{stroke:#9DB0CE} .ln-acc{stroke:#FFD24D} .ln-lnk{stroke:#8FB0E6}
.life{stroke:rgba(244,247,252,0.28)} .mask{fill:#0E1A30} .rule{stroke:rgba(244,247,252,0.16)}
}
</style>
<defs>
<marker id="m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="muted" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="acc" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-lnk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="lnk" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="1040" height="300" rx="10"/>
<text x="28" y="34" class="eye soft">CONFIGURATION CONTROL · THE LOOP</text>
<line class="rule" x1="28" y1="44" x2="1012" y2="44"/>
<path class="ln" stroke-width="1.2" d="M224,124.0 L272,124.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M404,124.0 L452,124.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M620,124.0 L668,124.0" marker-end="url(#m-muted)"/>
<path class="ln-acc" stroke-width="1.2" d="M738.0,86 L738.0,72 Q738.0,64 730.0,64 L346.0,64 Q338.0,64 338.0,72 L338.0,102" stroke-dasharray="5 4" marker-end="url(#m-acc)"/>
<path class="ln-acc" stroke-width="1.2" d="M808,124.0 L852,124.0" marker-end="url(#m-acc)"/>
<path class="ln" stroke-width="1.2" d="M980,124.0 L994,124.0 Q1000,124.0 1000,118.0 L1000,82 Q1000,76 994,76 L922.0,76 Q916.0,76 916.0,82 L916.0,90" stroke-dasharray="5 4" marker-end="url(#m-muted)"/>
<path class="ln-acc" stroke-width="1.2" d="M916.0,158 L916.0,220" marker-end="url(#m-acc)"/>
<path class="ln" stroke-width="1.2" d="M820.0,246.0 L772.0,246.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M640.0,246.0 L592.0,246.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M440.0,246.0 L138.0,246.0 Q130.0,246.0 130.0,238.0 L130.0,156" stroke-dasharray="5 4" marker-end="url(#m-muted)"/>
<rect class="n-store" stroke-width="1" x="36" y="92" width="188" height="64" rx="6"/>
<text x="130.0" y="115.0" class="name ink" text-anchor="middle">Controlled items</text>
<text x="130.0" y="130.0" class="sub soft" text-anchor="middle">code · prompts · models</text>
<text x="130.0" y="143.0" class="sub soft" text-anchor="middle">deps · docs · releases</text>
<rect class="n-step" stroke-width="1" x="272" y="102" width="132" height="44" rx="6"/>
<text x="338.0" y="128.0" class="name ink" text-anchor="middle">A change</text>
<rect class="n-step" stroke-width="1" x="452" y="96" width="168" height="56" rx="6"/>
<text x="536.0" y="121.5" class="name ink" text-anchor="middle">Evidence</text>
<text x="536.0" y="136.5" class="sub soft" text-anchor="middle">pass or gap, named</text>
<polygon class="n-focal" stroke-width="1.4" points="738.0,86 808,124.0 738.0,162 668,124.0"/>
<text x="738.0" y="121.5" class="name ink" text-anchor="middle">Decide</text>
<text x="738.0" y="136.5" class="sub soft" text-anchor="middle">on purpose</text>
<polygon class="n-focal" stroke-width="1.4" points="916.0,90 980,124.0 916.0,158 852,124.0"/>
<text x="916.0" y="120.0" class="name ink" text-anchor="middle">Cleared to</text>
<text x="916.0" y="136.0" class="name ink" text-anchor="middle">apply now?</text>
<rect class="n-store" stroke-width="1" x="820.0" y="220" width="192" height="52" rx="6"/>
<text x="916.0" y="243.5" class="name ink" text-anchor="middle">Saved baseline</text>
<text x="916.0" y="258.5" class="sub soft" text-anchor="middle">the approved version</text>
<rect class="n-step" stroke-width="1" x="640.0" y="224" width="132" height="44" rx="6"/>
<text x="706.0" y="250.0" class="name ink" text-anchor="middle">Operate</text>
<rect class="n-step" stroke-width="1" x="440.0" y="224" width="152" height="44" rx="6"/>
<text x="516.0" y="250.0" class="name ink" text-anchor="middle">Lessons learned</text>
<rect class="mask" x="494.0" y="56" width="88.0" height="15" rx="2"/>
<text x="538.0" y="67.5" class="lbl acc" text-anchor="middle">block / defer</text>
<rect class="mask" x="821.0" y="102.0" width="34.0" height="15" rx="2"/>
<text x="838" y="113.5" class="lbl acc" text-anchor="middle">ship</text>
<rect class="mask" x="902.0" y="68" width="88.0" height="15" rx="2"/>
<text x="946.0" y="79.5" class="lbl muted" text-anchor="middle">hold / lapsed</text>
<rect class="mask" x="902.0" y="181.0" width="28.0" height="15" rx="2"/>
<text x="916.0" y="192.5" class="lbl acc" text-anchor="middle">yes</text>
<rect class="mask" x="65.0" y="197.0" width="130.0" height="15" rx="2"/>
<text x="130.0" y="208.5" class="lbl muted" text-anchor="middle">feed the next change</text>
</svg>
