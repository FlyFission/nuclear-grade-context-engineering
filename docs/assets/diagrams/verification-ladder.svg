<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">Verification depth and method</title>
<desc id="d">Five rungs rise left to right. Self-check examines your own action and catches slips. A check follows the originator&#x27;s path and catches execution errors. Design review judges the basis itself and catches a wrong method or input. An alternate method reaches the result a second way and catches the first method&#x27;s blind spot. A qualification test runs the real artifact under worst-case conditions. The first two confirm work was executed as planned; the last three confirm it is right for its purpose. Mode minimums: Quick needs a self-check; Standard needs a check plus a design review or alternate method by someone other than the originator; Nuclear needs a design review plus an alternate method or qualification test, a verifier with freedom of thought from the performer, and a human.</desc>
<style>
.bg{fill:#F7F6F2} .ink{fill:#0E1A30} .muted{fill:#46536B} .soft{fill:#5A6680}
.acc{fill:#8A5A00} .lnk{fill:#2F4F94}
.n-step{fill:#FFFFFF;stroke:#0E1A30} .n-store{fill:rgba(14,26,48,0.05);stroke:#46536B}
.n-focal{fill:rgba(255,210,77,0.22);stroke:#8A5A00} .n-ext{fill:rgba(14,26,48,0.03);stroke:rgba(14,26,48,0.32)}
.n-opt{fill:rgba(14,26,48,0.02);stroke:rgba(14,26,48,0.36);stroke-dasharray:4 3}
.n-indep{fill:rgba(47,79,148,0.07);stroke:#2F4F94}
.grp{fill:none;stroke:rgba(14,26,48,0.22);stroke-dasharray:4 4}
.band{fill:rgba(14,26,48,0.035);stroke:rgba(14,26,48,0.10)}
.ln{fill:none;stroke:#46536B} .ln-acc{fill:none;stroke:#8A5A00} .ln-lnk{fill:none;stroke:#2F4F94}
.life{stroke:rgba(14,26,48,0.25);stroke-dasharray:3 4}
.mask{fill:#F7F6F2} .rule{stroke:rgba(14,26,48,0.14)}
.name{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}
.nm{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600}
.sub{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px}
.eye{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;font-weight:600;letter-spacing:0.16em}
.lbl{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:9.5px;letter-spacing:0.04em}
.ttl{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-size:22px}
.call{font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px}
@media (prefers-color-scheme: dark){
.bg{fill:#0E1A30} .ink{fill:#F4F7FC} .muted{fill:#B3C2DA} .soft{fill:#9DB0CE}
.acc{fill:#FFD24D} .lnk{fill:#8FB0E6}
.n-step{fill:#16263F;stroke:#D7E0EE} .n-store{fill:rgba(244,247,252,0.05);stroke:#9DB0CE}
.n-focal{fill:rgba(255,210,77,0.14);stroke:#FFD24D} .n-ext{fill:rgba(244,247,252,0.03);stroke:rgba(244,247,252,0.34)}
.n-opt{fill:rgba(244,247,252,0.02);stroke:rgba(244,247,252,0.40)}
.n-indep{fill:rgba(143,176,230,0.10);stroke:#8FB0E6}
.grp{stroke:rgba(244,247,252,0.26)} .band{fill:rgba(244,247,252,0.035);stroke:rgba(244,247,252,0.10)}
.ln{stroke:#9DB0CE} .ln-acc{stroke:#FFD24D} .ln-lnk{stroke:#8FB0E6}
.life{stroke:rgba(244,247,252,0.28)} .mask{fill:#0E1A30} .rule{stroke:rgba(244,247,252,0.16)}
}
</style>
<defs>
<marker id="m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="muted" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="acc" points="0 0, 8 3, 0 6"/></marker>
<marker id="m-lnk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="lnk" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="1100" height="560" rx="10"/>
<text x="28" y="34" class="eye soft">VERIFICATION · DEPTH AND METHOD</text>
<line class="rule" x1="28" y1="44" x2="1072" y2="44"/>
<rect class="grp" x="28" y="240" width="414" height="176" rx="8"/>
<text x="42" y="258" class="eye soft" text-anchor="start">CHECKING · EXECUTED AS PLANNED</text>
<rect class="grp" x="446" y="96" width="626" height="320" rx="8"/>
<text x="460" y="114" class="eye lnk" text-anchor="start">VERIFYING · RIGHT FOR ITS PURPOSE</text>
<rect class="band" x="28" y="436" width="1044" height="104" rx="8"/>
<text x="42" y="454" class="eye soft" text-anchor="start">MINIMUM FOR A LOAD-BEARING CLAIM, BY MODE</text>
<path class="ln" stroke-width="1.2" d="M196,330 L196,318.0 Q196,312.0 202,312.0 L248,312.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M404,278 L404,266.0 Q404,260.0 410,260.0 L456,260.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M612,226 L612,214.0 Q612,208.0 618,208.0 L664,208.0" marker-end="url(#m-muted)"/>
<path class="ln" stroke-width="1.2" d="M820,174 L820,162.0 Q820,156.0 826,156.0 L872,156.0" marker-end="url(#m-muted)"/>
<text x="28" y="74" class="call acc" text-anchor="start">Independent review: one result reached by two or more methods that can fail differently, at least one of them by someone other than the originator.</text>
<rect class="n-ext" stroke-width="1" x="40" y="330" width="184" height="68" rx="6"/>
<text x="132.0" y="348.0" class="eye soft" text-anchor="middle">RUNG 0</text>
<text x="132.0" y="362.0" class="name ink" text-anchor="middle">Self-check</text>
<text x="132.0" y="377.0" class="sub soft" text-anchor="middle">your own action</text>
<text x="132.0" y="390.0" class="sub soft" text-anchor="middle">catches slips</text>
<rect class="n-step" stroke-width="1" x="248" y="278" width="184" height="68" rx="6"/>
<text x="340.0" y="296.0" class="eye soft" text-anchor="middle">RUNG 1</text>
<text x="340.0" y="310.0" class="name ink" text-anchor="middle">Check</text>
<text x="340.0" y="325.0" class="sub soft" text-anchor="middle">the originator&#x27;s path</text>
<text x="340.0" y="338.0" class="sub soft" text-anchor="middle">catches execution errors</text>
<rect class="n-indep" stroke-width="1.4" x="456" y="226" width="184" height="68" rx="6"/>
<text x="548.0" y="244.0" class="eye lnk" text-anchor="middle">RUNG 2</text>
<text x="548.0" y="258.0" class="name ink" text-anchor="middle">Design review</text>
<text x="548.0" y="273.0" class="sub soft" text-anchor="middle">the basis itself</text>
<text x="548.0" y="286.0" class="sub soft" text-anchor="middle">catches wrong method, input</text>
<rect class="n-indep" stroke-width="1.4" x="664" y="174" width="184" height="68" rx="6"/>
<text x="756.0" y="192.0" class="eye lnk" text-anchor="middle">RUNG 3</text>
<text x="756.0" y="206.0" class="name ink" text-anchor="middle">Alternate method</text>
<text x="756.0" y="221.0" class="sub soft" text-anchor="middle">a second route, compared</text>
<text x="756.0" y="234.0" class="sub soft" text-anchor="middle">catches method-level errors</text>
<rect class="n-indep" stroke-width="1.4" x="872" y="122" width="184" height="68" rx="6"/>
<text x="964.0" y="140.0" class="eye lnk" text-anchor="middle">RUNG 4</text>
<text x="964.0" y="154.0" class="name ink" text-anchor="middle">Qualification test</text>
<text x="964.0" y="169.0" class="sub soft" text-anchor="middle">the real artifact, worst case</text>
<text x="964.0" y="182.0" class="sub soft" text-anchor="middle">catches wrong predictions</text>
<rect class="n-store" stroke-width="1" x="52" y="466" width="316" height="56" rx="6"/>
<text x="210.0" y="491.5" class="name ink" text-anchor="middle">Quick</text>
<text x="210.0" y="506.5" class="sub soft" text-anchor="middle">rung 0, recorded</text>
<rect class="n-store" stroke-width="1" x="396" y="466" width="316" height="56" rx="6"/>
<text x="554.0" y="485.0" class="name ink" text-anchor="middle">Standard</text>
<text x="554.0" y="500.0" class="sub soft" text-anchor="middle">rung 1 + rung 2 or 3</text>
<text x="554.0" y="513.0" class="sub soft" text-anchor="middle">not by the originator</text>
<rect class="n-store" stroke-width="1" x="740" y="466" width="316" height="56" rx="6"/>
<text x="898.0" y="485.0" class="name ink" text-anchor="middle">Nuclear / Tier 0</text>
<text x="898.0" y="500.0" class="sub soft" text-anchor="middle">rung 2 + rung 3 or 4 · a human</text>
<text x="898.0" y="513.0" class="sub soft" text-anchor="middle">verifier with freedom of thought</text>
</svg>
