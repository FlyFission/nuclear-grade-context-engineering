# Runs when a maintainer pushes a `v*` tag; see docs/05-reference/releasing.md.
# Nothing builds or publishes unless the tag matches every version declaration.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag, manifests, citation, and changelog must agree
        run: python -m nuclear_grade.release --tag "${GITHUB_REF_NAME}"
      - name: Release gates
        run: |
          python -m pip install --upgrade pip pytest ruff pyyaml build
          python -m pytest -q
          python -m ruff check .
          python tools/ng.py doctor .
          python tools/ng.py tokens .
      - name: Build
        run: python -m build --outdir dist
      - name: Receipts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/receipts
          for packet in .nuclear/changes/* docs/03-worked-examples/*/.nuclear/changes/* challenge/.nuclear/changes/*; do
            [ -d "$packet" ] || continue
            python tools/ng.py validate "$packet" --json > "dist/receipts/$(basename "$packet").json" || true
          done
          (cd dist && sha256sum *.whl *.tar.gz receipts/*.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf receipts.tar.gz -C dist receipts
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md." \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS receipts.tar.gz

  pypi:
    # Opt-in: repo variable PUBLISH_TO_PYPI=true, a PyPI Trusted Publisher, and
    # required reviewers on the `pypi` environment.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - run: mkdir -p publish && cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/
