<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1176" width="1280" height="1176" role="img" aria-labelledby="t d">
<title id="t">Skill map</title>
<desc id="d">The core path runs from using-nuclear-grade through questioning-attitude, rating-change-risk, creating-change-records, proving-claims, checking-release-readiness, controlling-approved-versions (recording the baseline) and learning-from-experience, which feeds back to questioning-attitude. Rating-change-risk branches to controlling-approved-versions (scoping what is controlled) and checking-what-a-change-affects. Heavier overlays switch on by consequence, each labeled with its trigger.</desc>
