<text x="1058.8000000000002" y="510.0" class="name ink" text-anchor="middle">Operate</text>
<rect class="n-store" stroke-width="1" x="1130.8000000000002" y="486.0" width="104" height="40" rx="20.0"/>
<text x="1182.8000000000002" y="510.0" class="name ink" text-anchor="middle">Learn</text>
<rect class="mask" x="788.4" y="398.0" width="82.0" height="15" rx="2"/>
<text x="829.4000000000001" y="409.5" class="lbl acc" text-anchor="middle">ship / defer</text>
<rect class="mask" x="920.8" y="454.0" width="28.0" height="15" rx="2"/>
<text x="934.8000000000001" y="465.5" class="lbl acc" text-anchor="middle">yes</text>
<rect class="mask" x="986.8" y="358.0" width="88.0" height="15" rx="2"/>
<text x="1030.8000000000002" y="369.5" class="lbl muted" text-anchor="middle">hold / lapsed</text>
<rect class="mask" x="518.0" y="198.0" width="40.0" height="15" rx="2"/>
<text x="538.0" y="209.5" class="lbl acc" text-anchor="middle">block</text>
<rect class="mask" x="514.0" y="588" width="172.0" height="15" rx="2"/>
<text x="600" y="599.5" class="lbl muted" text-anchor="middle">lessons feed the next basis</text>
</svg>
