name: nuclear-grade
version: 0.3.0
description: Configuration-management workflow surface for AI-assisted software changes.
validator_modes:
  - quick
  - standard
templates:
  quick:
    - risk.md
    - proof.md
  standard:
    - risk.md
    - basis.md
    - plan.md
    - trace.md
    - verification.md
    - ship.md
  cm:
    - controlled-items.md
    - change-impact.md
    - baseline.md
    - variance.md
    - opex.md
  golden-path:
    - questioning-attitude.md
    - spec.md
    - turnover.md
    - self-check.md
    - decision.md
  optional:
    - standard/supplier-trust.md
    - standard/red-team.md
    - standard/execution-trace.md
    - standard/wbs.md
skills:
  - questioning-attitude
  - using-nuclear-grade
  - identifying-controlled-items
  - screening-change-impact
  - baselining-configuration
  - classifying-change-risk
  - creating-change-packets
  - packing-agent-context
  - turning-over-agent-work
  - self-checking-agent-actions
  - proving-claims
  - reviewing-ship-readiness
  - learning-from-opex
  - checking-dependency-and-model-trust
  - checking-source-lineage
  - checking-license-and-assurance-boundaries
  - controlling-mission-drift
  - reviewing-code-quality
  - red-teaming-agent-changes
  - tracing-agent-execution
  - decomposing-work-breakdown
  - structuring-agentic-folders
  - closing-stale-packets
commands:
  - ng-question.md
  - ng-classify.md
  - ng-new.md
  - ng-cm-items.md
  - ng-impact.md
  - ng-baseline.md
  - ng-context-pack.md
  - ng-turnover.md
  - ng-self-check.md
  - ng-prove.md
  - ng-ship-review.md
  - ng-opex.md
  - ng-trust-check.md
  - ng-source-check.md
  - ng-legal-check.md
  - ng-drift-check.md
  - ng-code-review.md
  - ng-red-team.md
  - ng-trace.md
  - ng-wbs.md
  - ng-folders.md
  - ng-close-packet.md
token_budgets:
  # Per-file token ceilings enforced by `ng tokens` (see nuclear_grade/tokens.py).
  # Seeded above the 2026-05 measured maxima (desc 138, skill body 2489, command
  # 1295) with headroom, so the gate blocks regression, not the accepted corpus.
  description_max: 200
  skill_body_max: 3000
  command_max: 1600
  repeated_block_max_files: 8
boundaries:
  license: MIT
  assurance: evidence visibility only
  compliance_claim: none
